name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a release being published from main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: "30.0.16248370"
  CMAKE_VERSION: "4.1.2"
  ANDROID_PLATFORM: "platforms;android-37.0"
  BUILD_TOOLS: "build-tools;37.0.0"

jobs:
  engine:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: engine-host
      - name: Run host tests
        env:
          CMAKE_EXTRA_ARGS: -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: ./scripts/host-tests.sh
      - name: Run host tests with sanitizers
        env:
          HOST_TESTS_BUILD_DIR: build/host-tests-asan
          CMAKE_EXTRA_ARGS: -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          # Picked up by CMake at configure time; recover=all makes UBSan findings fatal.
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all
          LDFLAGS: -fsanitize=address,undefined
        run: ./scripts/host-tests.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-renders
          path: build/host-tests/renders/

  separation:
    name: Separation tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache@v6
        with:
          path: build/separation-cache
          key: separation-ort-1.31.0-htdemucs-v4-onnx-1
      - name: Run the real model on a synthetic mix
        run: ./scripts/separation-tests.sh

  build:
    name: Build, unit tests, screenshots
    runs-on: ubuntu-latest
    needs: engine
    env:
      VERSION_CODE: ${{ github.run_number }}
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'stable' || 'preview' }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.ANDROID_PLATFORM }} ${{ env.BUILD_TOOLS }} ndk;${{ env.NDK_VERSION }} cmake;${{ env.CMAKE_VERSION }}
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ndk
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and screenshots
        run: ./gradlew :project-model:test :app:testDebugUnitTest :app:recordRoborazziDebug
      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease
          ./scripts/check-jni.sh
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/pocket-studio.apk
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/screenshots/
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/pocket-studio.apk

  smoke:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.ANDROID_PLATFORM }} ${{ env.BUILD_TOOLS }} ndk;${{ env.NDK_VERSION }} cmake;${{ env.CMAKE_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew -PemulatorAbi :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: ./gradlew -PemulatorAbi :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-test-report
          path: app/build/reports/androidTests/

  publish:
    name: Publish APK
    runs-on: ubuntu-latest
    needs: [build, smoke, separation]
    # Forks and bots get no secrets: they build and test, but never publish.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Certificate of signing/release.p12; installs over previous versions only if it matches.
      EXPECTED_CERT_SHA256: f7b61d03e07c5514caa1d961acb400dc63d60659ae71cd4a2cbfb06eaf4dc646
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: dist
      - name: Check signing secret
        if: github.event_name != 'workflow_dispatch'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Secret SIGNING_PASSWORD missing: the APK is not signed with the stable key, nothing is published."
            exit 1
          fi
      - name: Verify APK is signed with the stable key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/pocket-studio.apk | tee dist/certs.txt
          grep -q "SHA-256 digest: ${EXPECTED_CERT_SHA256}" dist/certs.txt || {
            echo "::error::APK is not signed with the stable release key."; exit 1; }
      - name: Host the instrument banks (once each)
        # Free-licence General MIDI banks; their authors ask apps to serve their own copies.
        # The app downloads them from these releases and checks the same SHA-256 before use.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          host() {  # tag, file name, url, sha256, licence url, title
            if gh release view "$1" >/dev/null 2>&1; then echo "$1 already hosted"; return 0; fi
            mkdir -p sounds && rm -f "sounds/$2"
            case "$3" in
              *.deb) curl -fsSL --retry 3 -o sounds/pkg.deb "$3"
                     (cd sounds && ar x pkg.deb && tar xf data.tar.* && find . -name "$2" -exec mv {} "$2" \;) ;;
              *) curl -fsSL --retry 3 -o "sounds/$2" "$3" ;;
            esac
            echo "$4  sounds/$2" | sha256sum -c -
            curl -fsSL --retry 3 -o sounds/LICENSE.txt "$5"
            gh release create "$1" "sounds/$2" sounds/LICENSE.txt --latest=false --target main \
              --title "$6" --notes "Banque General MIDI sous licence libre (voir LICENSE.txt), copie servie à l'appli."
          }
          host sons-generaluser-gs-2.0.3 GeneralUser-GS.sf2 \
            https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60/GeneralUser-GS.sf2 \
            9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe \
            https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60/documentation/LICENSE.txt \
            "Bibliothèque d'instruments : GeneralUser GS 2.0.3"
          host sons-fluidr3-gm-3.1 FluidR3_GM.sf2 \
            http://deb.debian.org/debian/pool/main/f/fluid-soundfont/fluid-soundfont-gm_3.1-6_all.deb \
            74594e8f4250680adf590507a306655a299935343583256f3b722c48a1bc1cb0 \
            https://people.debian.org/~tg/sf/FluidR3Mono_GM/copyright \
            "Bibliothèque d'instruments : FluidR3 GM (MIT)"
          host sons-musescore-general-0.2 MuseScore_General.sf2 \
            https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General.sf2 \
            ee51d2c4b1525e70f19a45909c4fd7a2e26d91d115fa89dbf5a6bc413d8b9bf3 \
            https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General_License.md \
            "Bibliothèque d'instruments : MuseScore General 0.2 (MIT)"
      - name: Publish preview (pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          cp dist/pocket-studio.apk dist/pocket-studio-preview.apk
          gh release delete preview --yes --cleanup-tag || true
          {
            echo "Aperçu de la PR #${PR_NUMBER} : ${PR_TITLE}"
            echo "Version 0.0.${VERSION_CODE}"
            echo
            cat app/src/main/assets/changelog.txt
          } > dist/notes.md
          gh release create preview dist/pocket-studio-preview.apk \
            --prerelease --title "Aperçu (PR #${PR_NUMBER})" \
            --notes-file dist/notes.md --target "${{ github.event.pull_request.head.sha }}"
      - name: Publish stable release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/^val phase = \([0-9]*\)/0.\1/p' app/build.gradle.kts).${VERSION_CODE}
          gh release create "v${VERSION_NAME}" dist/pocket-studio.apk \
            --latest --title "Pocket Studio ${VERSION_NAME}" \
            --notes-file app/src/main/assets/changelog.txt --target "${{ github.sha }}"
