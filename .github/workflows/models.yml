name: Models

# Builds the on-device separation model once and hosts it on a dedicated release, like the
# instrument bank. The build is pinned and reproducible: the app checks the same SHA-256.
on:
  push:
    paths:
      - scripts/models/**
      - .github/workflows/models.yml
  workflow_dispatch:

# Each job builds then publishes its own release (pinned, checked builds; first-party actions only).
permissions:
  contents: read

jobs:
  demucs:
    name: HT-Demucs ONNX
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TAG: modele-htdemucs-v4-onnx-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Already hosted?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "hosted=true" >> "$GITHUB_OUTPUT"; else echo "hosted=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.check.outputs.hosted == 'false'
        with:
          python-version: '3.13'
      - name: Build the model (pinned, checked)
        if: steps.check.outputs.hosted == 'false'
        run: ./scripts/models/build-demucs.sh dist
      - name: Publish
        if: steps.check.outputs.hosted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/htdemucs.onnx dist/LICENSE-demucs.txt dist/LICENSE-demucs.onnx.txt \
            --latest=false --target main \
            --title "Modèle de séparation : HT-Demucs v4 (ONNX)" \
            --notes "HT-Demucs v4 de Meta (MIT), exporté en ONNX avec demucs.onnx de S. Sevagh (MIT). Reconstruit à l'identique par scripts/models/build-demucs.sh."

  stable-audio:
    name: Stable Audio Open Small (ONNX, int8)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TAG: modele-stable-audio-open-small-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Already hosted?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "hosted=true" >> "$GITHUB_OUTPUT"; else echo "hosted=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.check.outputs.hosted == 'false'
        with:
          python-version: '3.13'
      - name: Build the model (pinned, checked)
        if: steps.check.outputs.hosted == 'false'
        run: ./scripts/models/build-stable-audio.sh dist
      - name: Publish
        if: steps.check.outputs.hosted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/cond_q8.onnx dist/dit_l8.onnx dist/dec.onnx dist/tokenizer.json dist/LICENSE dist/NOTICE \
            --latest=false --target main \
            --title "Modèle de génération : Stable Audio Open Small (ONNX, int8)" \
            --notes "Powered by Stability AI. Stable Audio Open Small, Stability AI Community License (LICENSE, NOTICE). Export ONNX d'atauser001, allégé en int8 par scripts/models/build-stable-audio.sh (reconstruit à l'identique)."
