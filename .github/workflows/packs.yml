name: Packs

# Builds the sound packs and hosts them on a dedicated release. Runs once: an existing release is
# left alone (publish a new tag to rebuild).
# - one pack per style of scripts/packs/styles.json, generated with Stable Audio Open Small (the
#   model the app already uses); a pack of the previous release is reused, and extended with new
#   takes when styles.json's version is higher than the pack's;
# - one pack per entry of scripts/packs/libraries.json, made from free sound libraries (CC0);
# - one pack per entry of scripts/packs/instruments.json: multizone instruments (pianos, strings,
#   brass, woodwinds, harp) made from free SFZ libraries (public domain, CC BY 3.0, CC0).
# Then index.json (versions, sizes, SHA-256) goes on the release and on the fixed `sons-packs`
# catalogue release the app reads: new packs and updates reach phones without a new app.
on:
  push:
    paths:
      - scripts/packs/**
      - .github/workflows/packs.yml
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: a later run (a merge, another push) waits, then finds the release there.
concurrency:
  group: packs
  cancel-in-progress: false

env:
  TAG: sons-packs-6
  # Packs already built there are reused (and extended when styles.json asks for more).
  PREVIOUS: sons-packs-5
  # Fixed release whose index.json the app reads first (PackStore.CATALOGUE).
  CATALOGUE: sons-packs
  MODEL: https://github.com/benjaminpaquot123-netizen/pocket-studio/releases/download/modele-stable-audio-open-small-1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      hosted: ${{ steps.check.outputs.hosted }}
      styles: ${{ steps.styles.outputs.ids }}
      libraries: ${{ steps.styles.outputs.libraries }}
      instruments: ${{ steps.styles.outputs.instruments }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "hosted=true" >> "$GITHUB_OUTPUT"; else echo "hosted=false" >> "$GITHUB_OUTPUT"; fi
      - id: styles
        run: |
          echo "ids=$(python3 -c 'import json;print(json.dumps([s["id"] for s in json.load(open("scripts/packs/styles.json"))["styles"]]))')" >> "$GITHUB_OUTPUT"
          echo "libraries=$(python3 -c 'import json;print(json.dumps([p["id"] for p in json.load(open("scripts/packs/libraries.json"))["packs"]]))')" >> "$GITHUB_OUTPUT"
          echo "instruments=$(python3 -c 'import json;print(json.dumps([p["id"] for p in json.load(open("scripts/packs/instruments.json"))["instruments"]]))')" >> "$GITHUB_OUTPUT"

  # One download of the model (858 MB), shared through the cache: thirty jobs fetching it at once
  # from the release get HTTP 500s.
  model:
    needs: plan
    if: needs.plan.outputs.hosted == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v6
        id: cache
        with:
          path: model
          key: stable-audio-open-small-1
      - name: Download
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p model && cd model
          for f in cond_q8.onnx dit_l8.onnx dec.onnx tokenizer.json; do
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$f" "$MODEL/$f"
          done
      - name: Check
        run: |
          cd model
          sha256sum -c - <<'SUMS'
          31952d152e570649ef9e49882ea8a41d25a2746f2f6184c607e871b3ae636c82  cond_q8.onnx
          ee73eb76a354a3bb0676bd185956bb78d169f8535a0e23188212f0cc002bcf08  dit_l8.onnx
          96029859b4d563f3aff266e97e715190e8d53278c6e27ab94095535a0da4c911  dec.onnx
          d2acde0d8d71dd30a711834b07781b9c89feaac33fd332f60507699282740066  tokenizer.json
          SUMS

  build:
    needs: [plan, model]
    if: needs.plan.outputs.hosted == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        style: ${{ fromJSON(needs.plan.outputs.styles) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v6
        with:
          path: model
          key: stable-audio-open-small-1
          fail-on-cache-miss: true
      - name: Model (checked)
        run: |
          cd model
          sha256sum -c - <<'SUMS'
          31952d152e570649ef9e49882ea8a41d25a2746f2f6184c607e871b3ae636c82  cond_q8.onnx
          ee73eb76a354a3bb0676bd185956bb78d169f8535a0e23188212f0cc002bcf08  dit_l8.onnx
          96029859b4d563f3aff266e97e715190e8d53278c6e27ab94095535a0da4c911  dec.onnx
          d2acde0d8d71dd30a711834b07781b9c89feaac33fd332f60507699282740066  tokenizer.json
          SUMS
      - run: pip install -q -r scripts/packs/requirements.txt
      - name: Reuse a pack already published
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any failure (not there, broken download) falls back to generating the pack.
          if gh release download "$PREVIOUS" -p "${{ matrix.style }}.zip" -D prev &&
             mkdir -p "out/${{ matrix.style }}" && unzip -q "prev/${{ matrix.style }}.zip" -d "out/${{ matrix.style }}" &&
             test -f "out/${{ matrix.style }}/pack.json"; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf "out/${{ matrix.style }}" prev
          fi
      - name: Generate (or extend the reused pack)
        run: |
          read -r WANT SCALE < <(python3 -c 'import json;d=json.load(open("scripts/packs/styles.json"));print(d.get("version",1),d.get("scale",1))')
          HAVE=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("version",1))' "out/${{ matrix.style }}/pack.json" 2>/dev/null || echo 0)
          if [ "${{ steps.reuse.outputs.reused }}" != "true" ]; then
            python scripts/packs/generate_pack.py model scripts/packs/styles.json ${{ matrix.style }} out/${{ matrix.style }} --scale "$SCALE"
          elif [ "$HAVE" -lt "$WANT" ]; then
            python scripts/packs/generate_pack.py model scripts/packs/styles.json ${{ matrix.style }} out/${{ matrix.style }} --scale "$SCALE" --extend
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.style }}
          path: out/${{ matrix.style }}

  # Packs made from free libraries (no model): downloaded, picked, trimmed, normalized.
  library:
    needs: plan
    if: needs.plan.outputs.hosted == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pack: ${{ fromJSON(needs.plan.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -q -r scripts/packs/requirements.txt
      - name: Build
        run: python scripts/packs/library_pack.py scripts/packs/libraries.json ${{ matrix.pack }} out/${{ matrix.pack }} --cache "$RUNNER_TEMP/sources"
      - uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.pack }}
          path: out/${{ matrix.pack }}

  # Multizone instruments (phase 38): a sparse checkout of the SFZ library at a pinned commit (only
  # the recordings kept), reduced to a phone's memory budget, 16-bit FLAC at 48 kHz.
  instrument:
    needs: plan
    if: needs.plan.outputs.hosted == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        instrument: ${{ fromJSON(needs.plan.outputs.instruments) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -q -r scripts/packs/requirements.txt
      - name: Build
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: python scripts/packs/instrument_pack.py scripts/packs/instruments.json ${{ matrix.instrument }} out/${{ matrix.instrument }} --cache "$RUNNER_TEMP/sources"
      - uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.instrument }}
          path: out/${{ matrix.instrument }}

  # Published even if a few packs failed (they are simply not offered), never after a cancel.
  publish:
    needs: [plan, build, library, instrument]
    if: ${{ !cancelled() && needs.plan.outputs.hosted == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: pack-*
          path: packs
      - name: Zip and index
        run: |
          for d in packs/pack-*; do mv "$d" "packs/${d#packs/pack-}"; done
          python3 scripts/packs/build_index.py packs dist --release "$TAG"
          python3 -c "import json, sys; sys.exit(0 if json.load(open('dist/index.json'))['packs'] else 'no pack built')"
      - name: Licence of the model the sounds come from
        run: |
          curl -fsSL -o dist/LICENSE-stable-audio "$MODEL/LICENSE"
          curl -fsSL -o dist/NOTICE-stable-audio "$MODEL/NOTICE"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --latest=false --target main \
            --title "Packs de sons par style" \
            --notes "Sons générés avec Stable Audio Open Small (Powered by Stability AI, voir LICENSE-stable-audio et NOTICE-stable-audio) par scripts/packs, et sons libres (CC0 : Kenney, OpenGameArt, VCSL ; auteurs dans le pack.json de chaque pack et THIRD_PARTY.md). Instruments échantillonnés : Splendid Grand Piano (Akai, domaine public), Salamander Grand Piano V3 (Alexander Holm, CC BY 3.0), VS Chamber Orchestra Community Edition (Versilian Studios, CC0). Un .zip par pack ; index.json liste les versions, tailles et empreintes vérifiées par l'appli."
      - name: Catalogue the app reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$CATALOGUE" >/dev/null 2>&1 || gh release create "$CATALOGUE" --latest=false --target main \
            --title "Catalogue des packs de sons" --notes "index.json : la liste des packs à jour, lue par l'appli (les .zip sont sur les releases sons-packs-N)."
          gh release upload "$CATALOGUE" dist/index.json --clobber
